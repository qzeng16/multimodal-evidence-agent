services:
  - type: web
    name: qzeng16-multimodal-evidence-agent
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass

    envVars:
      - key: PORT
        value: "8000"

      - key: OPENAI_API_KEY
        value: disabled-static-demo-placeholder

      - key: SERVICE_API_KEY
        generateValue: true
